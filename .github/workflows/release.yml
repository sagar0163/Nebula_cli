name: Auto Release

on:
  push:
    branches: [main]
    # Skip if commit message contains "release" to avoid infinite loop
    paths-ignore:
      - '**.md'
      - '**.txt'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    # Skip if commit message contains "release" or "ci skip"
    if: "!contains(github.event.head_commit.message, 'release') && !contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run linter
        run: npm run lint || true

      - name: Release with patch version bump
        run: npm run release -- --patch --ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
